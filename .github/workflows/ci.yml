name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TotalSegmentator is deliberately not installed: it pulls a CUDA torch
      # build, and nothing in the test suite needs a GPU. The analysis code is
      # importable and testable without it.
      - run: pip install -e ".[dev]"
      - run: ruff check calculus
      - run: pytest -q
